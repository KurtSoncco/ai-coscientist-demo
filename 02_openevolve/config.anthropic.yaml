# OpenEvolve with an Anthropic API key (paid; https://console.anthropic.com).
# Uses Anthropic's OpenAI-compatible endpoint. The key must belong to a workspace.
# export ANTHROPIC_API_KEY=...   (never commit the key)
max_iterations: 30
random_seed: 42

llm:
  api_base: "https://api.anthropic.com/v1/"
  api_key: "${ANTHROPIC_API_KEY}"
  models:
    - name: "claude-haiku-4-5-20251001"   # small and cheap; enough for this task
      weight: 1.0
  temperature: 0.8

prompt:
  # Neutral on purpose: no hint of what x1, x2 and y are, so the model has to
  # work from the data instead of reciting a law it has read about.
  system_message: |
    You are a scientist looking for a law in experimental data. Improve the
    function fit(train_rows) so that the predict(x1, x2) it returns gives y
    for groups of measurements it has never seen. x1, x2 and y are positive
    and in arbitrary units, and the measurements are noisy. Estimate every
    constant from train_rows; do not hardcode numbers. Prefer short formulas
    with few fitted constants. Only the standard library is available.
  num_top_programs: 3
  num_diverse_programs: 2

database:
  population_size: 40
  num_islands: 2

evaluator:
  timeout: 20
  parallel_evaluations: 2
  cascade_evaluation: false
