# OpenEvolve on the free Gemini API tier (key from https://aistudio.google.com).
# export GEMINI_API_KEY=...   (never commit the key)
max_iterations: 30          # keep small: the free tier has low daily limits
random_seed: 42

llm:
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: "${GEMINI_API_KEY}"
  models:
    - name: "gemini-2.5-flash-lite"   # most generous free quota; swap for a Flash model if available
      weight: 1.0
  temperature: 0.8

prompt:
  system_message: |
    You are a physicist discovering a law from data. Improve the function
    predict_period_days(a_km, central_mass_kg) so it predicts orbital periods
    for any central body. Prefer short, physically meaningful formulas with
    few constants. Units: kilometers, kilograms, days.
  num_top_programs: 3
  num_diverse_programs: 2

database:
  population_size: 40
  num_islands: 2

evaluator:
  timeout: 20
  parallel_evaluations: 2
